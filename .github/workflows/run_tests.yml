name: Run Tests

on:
  workflow_call:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        required: false
        default: false
      continue_on_error:
        description: 'Continue workflow on error'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

env:
  GIT_HASH: ${{ github.sha }}
  GIT_REF_NAME: ${{ github.ref }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  POSTGRES_PASSWORD: mysecretpassword
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  MINIO_ADDRESS: http://localhost:9005
  MINIO_KEY: minioadmin
  S3_BUCKET: mint-app-file-uploads
  S3_ECHIMP_BUCKET: mint-app-echimp-uploads
  # Keep in sync with the pin in docker-compose.backend.yml and with the ECR mirror workflow
  # (manual_mirror_minio.yml) that publishes this tag to our own account.
  SILO_IMAGE_TAG: RELEASE.2026-09-16T00-00-00Z

jobs:
  skip_tests:
    if: ${{ inputs.skip_tests == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Skipping tests
        run: |
            echo "Skipping tests!"
  build_docker_images:
    if: ${{ inputs.skip_tests == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service_name:
          - mint
          - db_migrate
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.contribsys.com
          username: ${{ secrets.CONTRIBSYS_REPO_USERNAME }}
          password: ${{ secrets.CONTRIBSYS_REPO_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run buildx bake
        uses: docker/bake-action@v7.4.0
        with:
          files: "docker-compose.backend.yml"
          targets: "${{ matrix.service_name }}"
          set: |
            ${{ matrix.service_name }}.cache-from=type=gha,scope=${{ env.GIT_REF_NAME }}-${{ matrix.service_name }}
            ${{ matrix.service_name }}.cache-to=type=gha,mode=max,scope=${{ env.GIT_REF_NAME }}-${{ matrix.service_name }}

  # This is largely a copy of build_frontend_assets, but it doesn't use an `environment` block
  build_frontend_assets:
    if: ${{ inputs.skip_tests == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Write local env vars for testing
        run: |
          touch .envrc.local
          echo "export FLAG_SOURCE=FILE" >> .envrc.local
          # cy.login() covers hosted Okta/ELP redirect; bake the flag into the e2e asset build.
          # TODO(MINT-3761): remove once redirect login is permanent (always on).
          echo "export VITE_OKTA_REDIRECT_LOGIN_ENABLED=true" >> .envrc.local
          echo "export OKTA_TEST_USERNAME='${{ secrets.OKTA_TEST_USERNAME }}'" >> .envrc.local
          echo "export OKTA_TEST_PASSWORD='${{ secrets.OKTA_TEST_PASSWORD }}'" >> .envrc.local
          echo "export OKTA_TEST_SECRET='${{ secrets.OKTA_TEST_SECRET }}'" >> .envrc.local
      - name: Set env vars with direnv
        uses: HatsuneMiku3939/direnv-action@v1
      - name: yarn install
        run: yarn install --immutable
      - name: Build Frontend Assets
        run: yarn build
      - name: Upload Frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: e2e-frontend-assets
          path: build/
          retention-days: 10
      - name: Announce failure
        if: ${{ failure() }}
        run: |
          ./scripts/github-action-announce-broken-branch

  server_test:
    if: ${{ inputs.skip_tests == false && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 1s
          --health-retries 5

      faktory:
        image: docker.contribsys.com/contribsys/faktory-ent:latest
        credentials:
          username: ${{ secrets.CONTRIBSYS_REPO_USERNAME }}
          password: ${{ secrets.CONTRIBSYS_REPO_PASSWORD }}
        ports:
          - '7419:7419'
        options: >-
          --health-cmd "wget -nv -t1 --spider http://localhost:7420/stats"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # MinIO (via our pgsty/silo mirror) can't run as a native `services:` container here like
      # postgres/faktory above - GitHub Actions pulls `services:` images at job setup, before any
      # step has run, and a private ECR fallback (below) needs a freshly-generated, short-lived
      # token rather than a static credential a `services:` block could hold. So we start it by
      # hand, and wait for it the same way GitHub's own service health-check would.
      #
      # Primary source is docker.io/pgsty/silo directly, same as local dev. Our own ECR mirror
      # (populated by manual_mirror_minio.yml) is only a fallback for if Docker Hub itself becomes
      # unpullable - the exact failure mode that took out the original quay.io/minio image.
      - name: Pull MinIO (Silo)
        id: pull-silo-primary
        continue-on-error: true
        run: |
          # DUMMY/TEMPORARY: deliberately bogus repo name to force this step to fail, so this
          # throwaway PR exercises the ECR fallback path below. Not meant to merge.
          docker pull "docker.io/pgsty/silo-does-not-exist:$SILO_IMAGE_TAG"
          docker tag "docker.io/pgsty/silo-does-not-exist:$SILO_IMAGE_TAG" minio-silo:ci

      - name: Configure AWS credentials (ECR fallback)
        if: steps.pull-silo-primary.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.INFRA_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (fallback)
        if: steps.pull-silo-primary.outcome == 'failure'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull MinIO (Silo) from our ECR mirror (fallback)
        if: steps.pull-silo-primary.outcome == 'failure'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "::warning::docker.io/pgsty/silo pull failed, falling back to our ECR mirror"
          docker pull "$ECR_REGISTRY/mint-silo:$SILO_IMAGE_TAG"
          docker tag "$ECR_REGISTRY/mint-silo:$SILO_IMAGE_TAG" minio-silo:ci

      - name: Start MinIO (Silo)
        run: |
          docker run -d --name minio -p 9005:9000 \
            --health-cmd "curl -s http://localhost:9000/minio/health/live" \
            --health-interval 1s --health-timeout 1s --health-retries 5 \
            minio-silo:ci server /data

      - name: Wait for MinIO (Silo) to be healthy
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' minio)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "minio container did not become healthy in time" >&2
          docker logs minio
          exit 1

      - name: Migrate Database
        uses: docker://flyway/flyway:10.15-alpine
        with:
          args: migrate
        env:
          FLYWAY_URL: jdbc:postgresql://postgres:5432/${{ env.POSTGRES_DB }}
          FLYWAY_USER: ${{ env.POSTGRES_USER }}
          FLYWAY_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:./migrations
          FLYWAY_SCHEMAS: public
          FLYWAY_DEFAULT_SCHEMA: public
          FLYWAY_VALIDATE_MIGRATION_NAMING: true

      - name: Make MINIO Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_KEY }}
          # Clears any leftover AWS_SESSION_TOKEN from the ECR fallback login above - MinIO's
          # local minioadmin credentials aren't session-based, and a real STS token left over
          # from that step makes the AWS CLI send a request MinIO rejects as InvalidTokenId.
          AWS_SESSION_TOKEN: ''
          AWS_DEFAULT_REGION: us-west-2
        run: >-
          aws --endpoint-url ${{ env.MINIO_ADDRESS }}
          s3 mb s3://${{ env.S3_BUCKET }}

      - name: Make MINIO  EChimp Bucket
        env:
            AWS_ACCESS_KEY_ID: ${{ env.MINIO_KEY }}
            AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_KEY }}
            AWS_SESSION_TOKEN: ''
            AWS_DEFAULT_REGION: us-west-2
        run: >-
            aws --endpoint-url ${{ env.MINIO_ADDRESS }}
            s3 mb s3://${{ env.S3_ECHIMP_BUCKET }}

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install go modules
        run: go mod download

      - name: Set env vars with direnv
        uses: HatsuneMiku3939/direnv-action@v1

      - name: Run backend server tests
        run: |
          go test -short -count=1 -p=1 ./...

      - name: Logout Contribsys Docker Repo
        run: docker logout docker.contribsys.com
        if: always()

      # Leaving this commented out for now, but we should consider uploading these artifacts if they're
      # actually useful!
      # - name: Upload backend test artifacts
      #   uses: actions/upload-artifact@v
      #   with:
      #     name: backend-tests
      #     path: results
      #     retention-days: 14

      - name: Announce failure
        if: ${{ failure() }}
        run: |
          ./scripts/github-action-announce-broken-branch

  e2e_tests:
    if: ${{ inputs.skip_tests == false && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [build_docker_images, build_frontend_assets]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install go modules
        run: go mod download
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.contribsys.com
          username: ${{ secrets.CONTRIBSYS_REPO_USERNAME }}
          password: ${{ secrets.CONTRIBSYS_REPO_PASSWORD }}
      - name: Write local env vars for testing
        run: |
          touch .envrc.local
          echo "export FLAG_SOURCE=FILE" >> .envrc.local
          echo "export OKTA_TEST_USERNAME='${{ secrets.OKTA_TEST_USERNAME }}'" >> .envrc.local
          echo "export OKTA_TEST_PASSWORD='${{ secrets.OKTA_TEST_PASSWORD }}'" >> .envrc.local
          echo "export OKTA_TEST_SECRET='${{ secrets.OKTA_TEST_SECRET }}'" >> .envrc.local
      - name: Set env vars with direnv
        uses: HatsuneMiku3939/direnv-action@v1
      - name: Add "minio" to /etc/hosts
        run: sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run buildx bake
        uses: docker/bake-action@v7.4.0
        with:
          targets: mint,db_migrate
          files: "docker-compose.backend.yml"
          load: true
          set: |
            mint.cache-from=type=gha,scope=${{ env.GIT_REF_NAME }}-mint
            db_migrate.cache-from=type=gha,scope=${{ env.GIT_REF_NAME }}-db_migrate
      - name: Install yarn dependencies
        run: yarn install --immutable
      - name: Start backend services
        run: |
          scripts/dev down
          scripts/dev up:backend
      - name: Download Frontend assets
        uses: actions/download-artifact@v8
        with:
          name: e2e-frontend-assets
          path: build/
      - name: Start frontend
        run: yarn serve &
      - name: Run Cypress Tests
        run: |
          export FLAG_SOURCE=FILE
          yarn cypress run
      - name: Docker Compose Down
        if: always() # Always spin down the container
        run: |
          scripts/dev down
      - name: Upload cypress videos
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 14
      - name: Upload cypress screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Announce failure
        if: ${{ failure() }}
        run: |
          ./scripts/github-action-announce-broken-branch

  lint:
    if: ${{ inputs.skip_tests == false && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --immutable
      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install go modules
        run: go mod download
      # go-swagger is used for pre-commit hooks
      - name: Install go-swagger
        id: install-go-swagger
        run: |
          cd /usr/local/bin
          wget -O swagger https://github.com/go-swagger/go-swagger/releases/download/v0.28.0/swagger_linux_amd64
          chmod +x swagger
      - uses: actions/setup-python@v7 # Python is required for pre-commit/action
        with:
          python-version: '3.9'
      - name: Pre-commit checks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - name: Announce failure
        if: ${{ failure() }}
        run: |
          ./scripts/github-action-announce-broken-branch

  client_test:
    if: ${{ inputs.skip_tests == false && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue_on_error }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --immutable
      # Switch to :coverage when we have improved coverage numbers
      # TODO: https://jiraent.cms.gov/browse/EASI-1993
      # - run: yarn test:coverage
      - run: yarn test
      - name: Announce failure
        if: ${{ failure() }}
        run: |
          ./scripts/github-action-announce-broken-branch

  client_typecheck:
    if: ${{ inputs.skip_tests == false && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: Install yarn dependencies
        run: yarn install --immutable
      - name: Run typechecking
        id: typechecker
        # Uses GitHub environment files to store typechecker output and pass to next stage
        # see https://github.com/actions/toolkit/blob/main/docs/commands.md#environment-files
        run: |
          yarn build:ts 2>&1 | tee test.log
          result_code=${PIPESTATUS[0]}
          echo 'TS_LOG<<EOF' >> $GITHUB_ENV
          cat test.log >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
          exit $result_code
        continue-on-error: true
